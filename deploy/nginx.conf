# Nginx : reçoit les visiteurs en HTTPS et les renvoie vers les deux sites Next.js.
# À copier dans /etc/nginx/sites-available/surplace puis activer (voir DEPLOIEMENT.md).
# Remplacez surplace.ci par votre nom de domaine.

# Application (passagers, chauffeurs)
server {
    server_name surplace.ci www.surplace.ci;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Temps réel (Server-Sent Events) : pas de mise en tampon, connexion longue.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Photos de documents envoyées par les chauffeurs.
    client_max_body_size 10m;
    listen 80;
}

# Administration (équipe SURPLACE)
server {
    server_name admin.surplace.ci;

    # Facultatif mais conseillé : n'autoriser que certaines adresses IP (bureau, téléphone de l'équipe…).
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    listen 80;
}
